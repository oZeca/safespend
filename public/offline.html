<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b855f">
  <title>SafeSpend is offline</title>
  <style>
    :root{color-scheme:light;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}main{width:100%;max-width:440px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:36px;box-shadow:0 16px 40px rgba(15,23,42,.08)}img{width:76px;height:76px;border-radius:18px}h1{font-size:26px;margin:22px 0 10px}p{margin:0;color:#475569;line-height:1.6}button{min-height:44px;margin-top:24px;border:0;border-radius:9px;padding:0 20px;background:#0b855f;color:#fff;font:inherit;font-weight:650;cursor:pointer}button:focus-visible{outline:3px solid #86efac;outline-offset:3px}.privacy{margin-top:18px;font-size:13px}
  </style>
</head>
<body>
  <main>
    <img alt="" src="/icons/safespend-192.png" width="76" height="76">
    <h1>You’re offline</h1>
    <p>Reconnect to view current financial data or make changes in SafeSpend.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="privacy">For privacy, SafeSpend does not save financial pages for offline use.</p>
  </main>
</body>
</html>
